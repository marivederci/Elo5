<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
  :root{
    --color-bg: #FBFBFA;
    --color-surface: #ffffff;
    --color-surface-sunken: #F4F4F3;
    --color-text: #191917;
    --color-neutral-100: #F4F4F3;
    --color-neutral-200: #ECECEA;
    --color-neutral-300: #E1E1DE;
    --color-neutral-400: #CBCBC7;
    --color-neutral-500: #A8A8A3;
    --color-neutral-700: #63635E;
    --color-neutral-800: #464642;
    --color-divider: #E1E1DE;
    --color-accent: #0F8A80;
    --color-accent-100: #EDF7F5;
    --color-accent-300: #7CC9BF;
    --color-accent-600: #0C736B;
    --color-accent-700: #0A625C;
    --color-accent-800: #0A625C;
    --color-success: #2C7A57;
    --color-success-bg: #E4F0E9;
    --color-accent-2-600: #B4491F;
    --color-accent-2-700: #B4491F;
    --color-attention: #B4491F;
    --color-attention-bg: #FBEDE7;
    --font-heading: 'Instrument Sans', system-ui, sans-serif;
    --font-body: 'Instrument Sans', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --navbar-h: 64px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--color-bg);}
  body{font-family:var(--font-body);color:var(--color-text);-webkit-font-smoothing:antialiased;}
  #app{min-height:100%;}
  h1,h2{font-family:var(--font-heading);letter-spacing:-0.02em;}
  button{font-family:var(--font-body);}
  textarea,input{font-family:var(--font-body);}

  @keyframes eloIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .elo-tela{animation:eloIn .28s ease;}

  .wrap{width:100%;max-width:560px;margin:0 auto;padding:56px 24px 64px;min-height:100%;display:flex;flex-direction:column;}
  @media(min-width:700px){.wrap{padding:32px 48px 64px;}}
  .wrap-lista{max-width:560px;}
  @media(min-width:1000px){.wrap-lista{max-width:1000px;}}
  .wrap-largo{max-width:560px;}
  @media(min-width:1000px){.wrap-largo{max-width:1240px;}}
  .wrap-leitura{max-width:560px;}
  @media(min-width:700px){.wrap-leitura{max-width:820px;}}
  .pb-navbar{padding-bottom:calc(var(--navbar-h) + 32px);}

  .faixa{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--color-accent-100);color:var(--color-accent-700);font-size:14px;line-height:1.35;}
  .faixa.erro{background:var(--color-attention-bg);color:var(--color-attention);}
  .faixa i{font-size:20px;flex:none;}

  .btn{cursor:pointer;font-family:var(--font-body);font-weight:500;font-size:15px;min-height:48px;padding:0 20px;border-radius:6px;border:1px solid transparent;transition:background .15s,opacity .15s;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--color-accent);color:#fff;border-color:var(--color-accent);}
  .btn-primary:not(:disabled):hover{background:var(--color-accent-600);border-color:var(--color-accent-600);}
  .btn-secondary{background:var(--color-surface);color:var(--color-text);border-color:var(--color-neutral-400);}
  .btn-secondary:not(:disabled):hover{background:var(--color-neutral-100);}
  .btn-ghost{background:transparent;color:var(--color-text);border:none;padding:0;font-size:14px;text-align:left;}
  .btn-icon{background:transparent;border:none;cursor:pointer;padding:4px;}
  .btn-block{width:100%;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--color-neutral-400);border-radius:6px;background:var(--color-surface);color:var(--color-text);}
  .input:focus-visible{outline:2px solid var(--color-accent);outline-offset:1px;}
  .input::placeholder{color:var(--color-neutral-700);}
  textarea.input{resize:vertical;}

  .tag{display:inline-flex;align-items:center;font-family:var(--font-body);font-weight:500;font-size:12px;padding:3px 9px;border-radius:4px;}
  .tag-neutral{background:var(--color-neutral-200);color:var(--color-neutral-800);}
  .tag-accent-2{background:var(--color-attention-bg);color:var(--color-attention);}
  .tag-success{background:var(--color-success-bg);color:var(--color-success);}

  .card{cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:10px;transition:border-color .15s;}
  .card:hover{border-color:var(--color-neutral-400);}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .card-title{font-family:var(--font-heading);font-weight:600;font-size:17px;letter-spacing:-0.01em;}
  .grid-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;}
  @media(min-width:1000px){.grid-cards{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .bar-bg{height:4px;border-radius:999px;background:var(--color-neutral-200);}
  .bar-fill{height:4px;border-radius:999px;background:var(--color-accent);}

  .degraus{display:flex;gap:3px;padding:4px 8px;background:var(--color-neutral-100);border-radius:999px;}
  .degrau{width:6px;height:6px;border-radius:999px;}

  .grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:0;align-items:start;}
  @media(min-width:1000px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 48px;}}

  ::selection{background:var(--color-accent-100);color:var(--color-accent-700);}

  .voltar{align-self:flex-start;margin:0 0 16px -5px;display:inline-flex;align-items:center;gap:4px;color:var(--color-neutral-700);}
  .voltar i{font-size:18px;}

  .carregando{display:flex;align-items:center;justify-content:center;min-height:100%;color:var(--color-neutral-700);font-size:14px;}

  /* ---------- Navbar fixa (telas de navegação/organização) ---------- */
  .navbar{position:fixed;left:0;right:0;bottom:0;height:var(--navbar-h);background:var(--color-surface);border-top:1px solid var(--color-divider);display:flex;z-index:20;}
  .navbar-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--color-neutral-700);cursor:pointer;position:relative;background:transparent;border:none;}
  .navbar-item i{font-size:22px;}
  .navbar-item.ativo{color:var(--color-accent);}
  .navbar-badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:999px;background:var(--color-attention);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  @media(min-width:1000px){
    .navbar{top:0;bottom:0;right:auto;left:0;width:88px;height:auto;flex-direction:column;border-top:none;border-right:1px solid var(--color-divider);padding-top:24px;gap:8px;}
    .navbar-item{flex:none;height:64px;}
  }

  /* ---------- Breadcrumb tocável ---------- */
  .breadcrumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--color-neutral-700);margin-bottom:10px;}
  .breadcrumb .bc-item{cursor:pointer;}
  .breadcrumb .bc-item:hover{color:var(--color-text);text-decoration:underline;}
  .breadcrumb .bc-sep{color:var(--color-neutral-400);}
  .breadcrumb .bc-atual{color:var(--color-text);font-weight:500;}

  /* ---------- Avatar de área ---------- */
  .avatar-area{width:40px;height:40px;border-radius:999px;background:var(--color-accent-100);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:none;}

  /* ---------- Revisões de hoje ---------- */
  .card-due{border:1px solid var(--color-accent-300);border-radius:10px;overflow:hidden;}
  .card-due-head{background:var(--color-accent-100);color:var(--color-accent-700);padding:14px 16px;font-weight:600;font-size:15px;}
  .card-due-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--color-divider);cursor:pointer;background:var(--color-surface);}
  .card-due-item:hover{background:var(--color-neutral-100);}

  /* ---------- Cabeçalho das telas de sessão de estudo (sem navbar) ---------- */
  .sessao-header{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--color-divider);}
  .sessao-close{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--color-neutral-700);cursor:pointer;background:transparent;border:none;font-size:18px;padding:0;}
  .sessao-close:hover{background:var(--color-neutral-100);}
  .sessao-titulos{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0;}
  .sessao-titulo{font-size:15px;font-weight:600;letter-spacing:-0.01em;}
  .sessao-subtitulo{font-size:12px;color:var(--color-neutral-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- Seletor de 3 estados no Checklist ---------- */
  .estado-btn{cursor:pointer;font-family:var(--font-body);font-weight:500;font-size:13px;min-height:44px;flex:1;border-radius:6px;border:1px solid var(--color-neutral-400);background:var(--color-surface);color:var(--color-neutral-700);}
  .estado-btn:hover{background:var(--color-neutral-100);}
  .estado-btn.sel-sucesso{border-color:var(--color-success);background:var(--color-success-bg);color:var(--color-success);}
  .estado-btn.sel-atencao{border-color:var(--color-attention);background:var(--color-attention-bg);color:var(--color-attention);}

  /* ---------- Card de conceito-chave (Checklist e Reestudo) ---------- */
  .card-conceito{display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:10px;}

  /* ---------- Menu de ações (renomear/excluir) — Área e Disciplina ---------- */
  .card-head-actions{position:relative;display:flex;align-items:center;flex:none;}
  .btn-kebab{background:transparent;border:none;cursor:pointer;padding:0;min-width:44px;min-height:44px;border-radius:6px;color:var(--color-neutral-700);display:flex;align-items:center;justify-content:center;}
  .btn-kebab:hover{background:var(--color-neutral-100);}
  .menu-overlay{position:fixed;inset:0;z-index:25;background:transparent;border:none;padding:0;cursor:default;}
  .menu-acoes{position:absolute;top:100%;right:0;margin-top:2px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:8px;box-shadow:0 6px 20px rgba(25,25,23,.10);min-width:168px;z-index:30;overflow:hidden;}
  .menu-acoes button{display:block;width:100%;text-align:left;padding:12px 14px;font-size:14px;font-family:var(--font-body);background:transparent;border:none;cursor:pointer;color:var(--color-text);min-height:44px;}
  .menu-acoes button:hover{background:var(--color-neutral-100);}
  .menu-acoes button.destrutivo{color:var(--color-attention);}

  /* ---------- Modal (renomear / confirmar exclusão) ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(25,25,23,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .modal-box{background:var(--color-surface);border-radius:12px;padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;}
  .modal-box h2{margin:0;font-family:var(--font-heading);font-size:18px;letter-spacing:-0.01em;}
  .modal-box p{margin:0;font-size:14px;line-height:1.5;color:var(--color-neutral-800);}
  .btn-destrutivo{background:var(--color-attention);color:#fff;border-color:var(--color-attention);}
  .btn-destrutivo:not(:disabled):hover{background:#963c19;border-color:#963c19;}

  /* ---------- Blocos de estatística (Perfil) ---------- */
  .stats-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;}
  .stat-card{flex:1;min-width:150px;padding:20px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:10px;display:flex;flex-direction:column;gap:4px;}
  .stat-num{font-family:var(--font-heading);font-size:30px;font-weight:600;letter-spacing:-0.02em;}
  .stat-label{font-size:13px;color:var(--color-neutral-700);}

  /* ---------- Aba "Revisões de hoje" — preview de próximos dias ---------- */
  .proximos-grupo-titulo{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--color-neutral-500);margin:16px 0 6px;}
  .proximos-item{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--color-neutral-200);font-size:13px;color:var(--color-neutral-700);}
  .proximos-item .conteudo-nome{color:var(--color-text);font-weight:500;flex:none;}
  .proximos-item .disc-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .proximos-item .qtd{flex:none;color:var(--color-neutral-500);font-variant-numeric:tabular-nums;}
</style>
</head>

<!-- Google Identity Services — login com Google sem depender do Firebase
     Hosting (evita o /__/auth/handler, que só existe se Hosting foi
     implantado). onGoogleLibraryLoad() é chamado quando o script carrega. -->
<script src="https://accounts.google.com/gsi/client" async defer onload="onGoogleLibraryLoad()"></script>
<script>
"use strict";
/* ============================================================
   Elo — estudo por recordação
   Firebase (Firestore + Auth Anônima) + JS vanilla, sem build.
   ============================================================ */

const GOOGLE_CLIENT_ID = '93982573433-o14pf60b525eea0urssi9h8u183o70td.apps.googleusercontent.com';

const firebaseConfig = {
  apiKey: "AIzaSyDCU9a2g9dOE_EKk8NkuHPUOAH2EkQZln4",
  authDomain: "elo-ddaa5.firebaseapp.com",
  projectId: "elo-ddaa5",
  storageBucket: "elo-ddaa5.firebasestorage.app",
  messagingSenderId: "93982573433",
  appId: "1:93982573433:web:67ea1ca6addc78582e65a8",
  measurementId: "G-3D9WTKCF2T"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* ---------- Constantes de domínio ---------- */
const INTERVALOS_DIAS = { 1: 1, 2: 3, 3: 7, 4: 15, 5: 30 };

const MSG = {
  erroSalvar: 'Não deu pra salvar — tenta de novo.',
  areaCriada: 'Área criada.',
  disciplinaCriada: 'Disciplina criada.',
  conteudoCriado: 'Conteúdo criado.',
  leituraConcluida: 'Leitura concluída — agora você pode revisar os conceitos-chave.',
  recordacaoEnviada: 'Recordação enviada. Compare com cada conceito-chave.',
  tudoCerto: 'Você lembrou de tudo. 🎉',
  algoFaltou: 'Autoavaliação concluída. Vamos reestudar o que faltou.',
  reestudoConcluido: 'Reestudo concluído. Esses conceitos voltam para a caixa 1.',
  nomeAtualizado: 'Nome atualizado.',
  itemExcluido: 'Excluído.'
};

/* ---------- Estado ---------- */
let uid = null;
let unsubAreas = null, unsubDisciplinas = null, unsubConteudos = null, unsubConceitos = null, unsubRegistros = null;
let migracaoAreaFeita = false, migracaoAreaEmAndamento = false;

const state = {
  usuario: null,       // { nome } | null
  usuarioCarregado: false,
  areas: [],           // [{ id, nome, criadoEm }]
  disciplinas: [],     // [{ id, areaId, nome, criadoEm }]
  conteudos: [],       // [{ id, disciplinaId, titulo, material, revisado, avaliado, criadoEm }]
  conceitos: [],       // [{ id, conteudoId, texto, caixa, dominado, proximaRevisao, criadoEm }]
  registros: []        // [{ id, pontoId, resultado, caixaAntes, caixaDepois, criadoEm }] — usado na sequência de dias do Perfil
};

const ui = {
  screen: 'carregando', // carregando | onboarding | dashboard | area | disciplina | conteudo | perfil | ler | livre | checklist | reestudo | revisoes
  areaId: null,
  discId: null,
  contId: null,
  modo: 'ciclo2',       // ciclo2 | ciclo5 — define quais conceitos entram no checklist
  marcas: {},           // conceitoId -> 'acertei' | 'errei' | 'nao'
  revisados: {},        // conceitoId -> true (marcado no reestudo)
  abertosTrechos: {},   // conceitoId -> bool (trecho do material aberto no checklist)
  criandoArea: false,
  criandoDisciplina: false,
  criandoConteudo: false,
  criandoConceito: false,
  erroOnboarding: false,
  ultimaRecordacao: '',
  faixa: '',
  faixaErro: false,
  salvando: false,
  menuAberto: null,          // { tipo: 'area'|'disciplina', id } | null — menu de ações aberto
  renomeando: null,          // { tipo, id, valor } | null — modal de renomear
  confirmandoExclusao: null  // { tipo, id, nome } | null — modal de confirmar exclusão
};
let faixaTimer = null;

function flash(msg, erro) {
  ui.faixa = msg; ui.faixaErro = !!erro;
  clearTimeout(faixaTimer);
  // Some passos de estudo, ao concluir, imprimem uma faixa de feedback (`flash`)
  // ao mesmo tempo em que abrem um novo formulário logo em seguida (ex.: "Disciplina
  // criada." + já digitando o próximo item). Por isso o auto-close da faixa NÃO
  // chama render() (que reconstruiria o DOM inteiro e apagaria o que já foi
  // digitado em qualquer campo aberto) — só remove o próprio elemento da faixa.
  faixaTimer = setTimeout(() => {
    ui.faixa = '';
    const el = document.querySelector('.faixa');
    if (el) el.remove();
  }, 3600);
}

/* ---------- Datas / Leitner ---------- */
function hojeStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDias(baseStr, dias) {
  const d = baseStr ? new Date(baseStr + 'T00:00:00') : new Date();
  d.setDate(d.getDate() + dias);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function estaDue(conceito) {
  return !conceito.dominado && !!conceito.proximaRevisao && conceito.proximaRevisao <= hojeStr();
}
function degraus(n) {
  return [0, 1, 2, 3, 4].map(i => `<span class="degrau" style="background:${i < n ? 'var(--color-accent)' : 'var(--color-neutral-400)'}"></span>`).join('');
}
function legendaCurta(n) {
  return 'Caixa ' + n + ' de 5';
}
function legenda(n) {
  return 'Caixa ' + n + ' de 5 — cada acerto avança uma caixa; a caixa 5 é o domínio.';
}

/* ---------- Sequência de dias (Perfil) — sempre em fuso horário local, nunca UTC ---------- */
function dataStrDeMs(ms) {
  const d = new Date(ms);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sequenciaDias() {
  const dias = new Set(state.registros.map(r => dataStrDeMs(r.criadoEm)));
  const cursor = new Date();
  let atual = dataStrDeMs(cursor.getTime());
  if (!dias.has(atual)) {
    // Ainda não revisou hoje — não zera a sequência no meio do dia, só
    // confere se ontem foi revisado antes de considerar quebrada.
    cursor.setDate(cursor.getDate() - 1);
    atual = dataStrDeMs(cursor.getTime());
  }
  let n = 0;
  while (dias.has(atual)) {
    n++;
    cursor.setDate(cursor.getDate() - 1);
    atual = dataStrDeMs(cursor.getTime());
  }
  return n;
}
function estatisticasPerfil() {
  return {
    semHistorico: !state.registros.length,
    sequencia: sequenciaDias(),
    dominados: state.conceitos.filter(c => c.dominado).length,
    totalConceitos: state.conceitos.length
  };
}

/* ---------- "Próximos dias" (aba Revisões de hoje) — só um preview, não é due ainda ---------- */
function rotuloRelativo(dataStr) {
  const hoje = new Date(hojeStr() + 'T00:00:00');
  const alvo = new Date(dataStr + 'T00:00:00');
  const dias = Math.round((alvo - hoje) / 86400000);
  if (dias <= 1) return 'Amanhã';
  return 'Em ' + dias + ' dias';
}
function proximosDias(janelaDias) {
  const limite = addDias(hojeStr(), janelaDias || 7);
  const porData = {}; // dataStr -> [{ disciplina, conteudo, quantidade }]
  state.conteudos.forEach(c => {
    const futuros = conceitosDe(c.id).filter(k => !k.dominado && k.proximaRevisao && k.proximaRevisao > hojeStr() && k.proximaRevisao <= limite);
    if (!futuros.length) return;
    const porDataDoConteudo = {};
    futuros.forEach(k => { (porDataDoConteudo[k.proximaRevisao] = porDataDoConteudo[k.proximaRevisao] || []).push(k); });
    const disc = discPorId(c.disciplinaId);
    Object.keys(porDataDoConteudo).forEach(data => {
      (porData[data] = porData[data] || []).push({ disciplina: disc ? disc.nome : '', conteudo: c.titulo, quantidade: porDataDoConteudo[data].length });
    });
  });
  return Object.keys(porData).sort().map(data => ({ label: rotuloRelativo(data), itens: porData[data] }));
}

/* ---------- Helpers derivados ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function areaPorId(id) { return state.areas.find(a => a.id === id) || null; }
function discPorId(id) { return state.disciplinas.find(d => d.id === id) || null; }
function contPorId(id) { return state.conteudos.find(c => c.id === id) || null; }
function disciplinasDe(areaId) {
  return state.disciplinas.filter(d => d.areaId === areaId).sort((a, b) => a.criadoEm - b.criadoEm);
}
function conteudosDe(discId) {
  return state.conteudos.filter(c => c.disciplinaId === discId).sort((a, b) => a.criadoEm - b.criadoEm);
}
function conceitosDe(contId) {
  return state.conceitos.filter(k => k.conteudoId === contId).sort((a, b) => a.criadoEm - b.criadoEm);
}
function areaAtual() { return areaPorId(ui.areaId); }
function discAtual() { return discPorId(ui.discId); }
function contAtual() { return contPorId(ui.contId); }

function resumoArea(area) {
  const discs = disciplinasDe(area.id);
  const todos = discs.reduce((acc, d) => acc.concat(conteudosDe(d.id).reduce((a2, c) => a2.concat(conceitosDe(c.id)), [])), []);
  const dom = todos.filter(c => c.dominado).length;
  const avaliado = todos.length ? state.conteudos.some(c => discs.some(d => d.id === c.disciplinaId) && c.avaliado) : false;
  const primeiraDisc = discs[0];
  return {
    avaliado, mostrarBarra: avaliado && todos.length > 0,
    largura: todos.length ? Math.round((dom / todos.length) * 100) + '%' : '0%',
    texto: avaliado ? dom + ' de ' + todos.length + ' conceitos-chave dominados'
      : (primeiraDisc ? 'Comece revisando ' + primeiraDisc.nome : 'Cadastre sua primeira disciplina para começar')
  };
}

function progressoDe(cont) {
  const conceitos = conceitosDe(cont.id);
  const total = conceitos.length;
  const dominados = conceitos.filter(c => c.dominado).length;
  if (!cont.avaliado) {
    return total ? 'Comece revisando ' + cont.titulo : 'Cadastre seu primeiro conceito-chave para começar';
  }
  return dominados + ' de ' + total + ' conceitos-chave dominados';
}
function etiquetaDe(cont) {
  const conceitos = conceitosDe(cont.id);
  const total = conceitos.length;
  const dominados = conceitos.filter(c => c.dominado).length;
  if (total && dominados === total) return 'Dominado';
  if (cont.revisado || cont.avaliado) return 'Em progresso';
  return 'Não iniciado';
}
function resumoDisciplina(disc) {
  const conts = conteudosDe(disc.id);
  const todos = conts.reduce((acc, c) => acc.concat(conceitosDe(c.id)), []);
  const dom = todos.filter(c => c.dominado).length;
  const avaliado = conts.some(c => c.avaliado);
  const primeiro = conts[0];
  return {
    avaliado, mostrarBarra: avaliado && todos.length > 0,
    largura: todos.length ? Math.round((dom / todos.length) * 100) + '%' : '0%',
    texto: avaliado ? dom + ' de ' + todos.length + ' conceitos-chave dominados'
      : (primeiro ? 'Comece revisando ' + primeiro.titulo : 'Cadastre seu primeiro conteúdo para começar')
  };
}
function trechoPara(cont, conceito) {
  if (!cont || !cont.material) return '';
  const frases = cont.material.split(/(?<=\.)\s+/);
  const palavras = conceito.texto.toLowerCase().split(/\W+/).filter(w => w.length > 5);
  let melhor = '', nota = 0;
  frases.forEach(f => {
    const fl = f.toLowerCase();
    const n = palavras.filter(w => fl.indexOf(w) >= 0).length;
    if (n > nota) { nota = n; melhor = f; }
  });
  return nota ? melhor.trim() : '';
}
function dueDoConteudo(contId) { return conceitosDe(contId).filter(estaDue); }
function dueTodos() {
  const out = [];
  state.conteudos.forEach(c => {
    const due = dueDoConteudo(c.id);
    if (!due.length) return;
    const disc = discPorId(c.disciplinaId);
    out.push({ discId: c.disciplinaId, contId: c.id, disciplina: disc ? disc.nome : '', conteudo: c.titulo, quantidade: due.length });
  });
  return out;
}

/* ============================================================
   Firestore — auth, listeners, leitura/escrita
   ============================================================ */
function garantirAuth() {
  auth.onAuthStateChanged(user => {
    if (user) {
      uid = user.uid;
      assinarColecoes();
    } else {
      auth.signInAnonymously().catch(err => {
        console.error(err);
        document.getElementById('app').innerHTML =
          '<div class="carregando">Não deu pra conectar. Recarregue a página para tentar de novo.</div>';
      });
    }
  });
}

// --- Login com Google via Google Identity Services (sem depender do
// Firebase Hosting/authDomain) ---

// Chamado pelo onload do script do Google, uma vez, quando a biblioteca
// termina de carregar (script async/defer, então não dá pra chamar isso
// direto no topo do arquivo — a lib ainda não existiria nesse momento).
function onGoogleLibraryLoad() {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredentialResponse
  });
  renderGoogleButtons();
}

// Desenha o botão oficial do Google nos contêineres que existirem na tela
// atual (Onboarding e/ou Perfil). Chamado de novo a cada render(), porque
// o innerHTML é substituído inteiro a cada tela.
function renderGoogleButtons() {
  if (!window.google || !google.accounts || !google.accounts.id) return;
  ['google-btn-onboarding', 'google-btn-perfil'].forEach(id => {
    const el = document.getElementById(id);
    if (el) google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'continue_with', width: 280 });
  });
}

// Recebe o token do Google (sem sair da página) e entrega pro Firebase.
async function handleGoogleCredentialResponse(response) {
  const credential = firebase.auth.GoogleAuthProvider.credential(response.credential);
  const finalizar = async () => {
    // Login já veio direto pelo Google, sem passar pelo campo manual do
    // Onboarding — usa o nome do perfil do Google agora que ele existe.
    if (!state.usuario && auth.currentUser && auth.currentUser.displayName) {
      try { await salvarNome(auth.currentUser.displayName); } catch (e) { console.error(e); }
    }
    render();
  };
  try {
    await auth.currentUser.linkWithCredential(credential);
    await finalizar();
  } catch (err) {
    if (err.code === 'auth/credential-already-in-use') {
      // Essa conta Google já está vinculada a outro uid (ex.: aluno testou
      // em outro aparelho antes) — entra direto nela, recuperando o
      // histórico correto, em vez de tentar vincular de novo.
      try {
        await auth.signInWithCredential(credential);
        await finalizar();
      } catch (err2) {
        console.error(err2);
        flash('Não deu pra entrar com Google (' + (err2.code || 'erro desconhecido') + '). Tenta de novo.', true);
        render();
      }
    } else {
      console.error(err);
      flash('Não deu pra entrar com Google (' + (err.code || 'erro desconhecido') + '). Tenta de novo.', true);
      render();
    }
  }
}

function assinarColecoes() {
  db.collection('usuarios').doc(uid).onSnapshot(doc => {
    state.usuario = doc.exists ? doc.data() : null;
    state.usuarioCarregado = true;
    // Login via Google já traz o nome pronto no perfil — se ainda não existe
    // o documento em `usuarios`, salva automaticamente e pula a tela de
    // Onboarding em vez de pedir pro aluno digitar o nome de novo.
    if (!doc.exists && auth.currentUser && auth.currentUser.displayName) {
      salvarNome(auth.currentUser.displayName).catch(err => console.error(err));
      return;
    }
    if (ui.screen === 'carregando') ui.screen = state.usuario ? 'dashboard' : 'onboarding';
    render();
  }, err => console.error(err));

  unsubAreas = db.collection('areas').where('usuarioId', '==', uid).onSnapshot(snap => {
    state.areas = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, err => console.error(err));

  unsubDisciplinas = db.collection('disciplinas').where('usuarioId', '==', uid).onSnapshot(snap => {
    state.disciplinas = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    migrarDisciplinasSemArea().catch(err => console.error(err));
    render();
  }, err => console.error(err));

  unsubConteudos = db.collection('conteudos').where('usuarioId', '==', uid).onSnapshot(snap => {
    state.conteudos = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, err => console.error(err));

  unsubConceitos = db.collection('pontos').where('usuarioId', '==', uid).onSnapshot(snap => {
    state.conceitos = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, err => console.error(err));

  // Usado só para a sequência de dias no Perfil. Precisa que a regra de
  // segurança de `registros` permita `read` além de `create` (ver rules).
  unsubRegistros = db.collection('registros').where('usuarioId', '==', uid).onSnapshot(snap => {
    state.registros = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, err => console.error(err));
}

// Migração silenciosa: disciplinas criadas antes da área existir (testes
// anteriores) não têm `areaId`. Na primeira vez que isso é detectado, cria
// (ou reaproveita) uma área "Geral" e move essas disciplinas pra dentro dela
// — sem perguntar nada ao aluno, sem perder nenhum dado já cadastrado.
async function migrarDisciplinasSemArea() {
  if (migracaoAreaFeita || migracaoAreaEmAndamento) return;
  const semArea = state.disciplinas.filter(d => !d.areaId);
  if (!semArea.length) { migracaoAreaFeita = true; return; }
  migracaoAreaEmAndamento = true;
  try {
    let geral = state.areas.find(a => a.nome === 'Geral');
    let geralId = geral && geral.id;
    if (!geralId) {
      const snap = await db.collection('areas').where('usuarioId', '==', uid).where('nome', '==', 'Geral').limit(1).get();
      geralId = snap.empty ? null : snap.docs[0].id;
    }
    if (!geralId) {
      const ref = await db.collection('areas').add({ usuarioId: uid, nome: 'Geral', criadoEm: Date.now() });
      geralId = ref.id;
    }
    const batch = db.batch();
    semArea.forEach(d => batch.update(db.collection('disciplinas').doc(d.id), { areaId: geralId }));
    await batch.commit();
    migracaoAreaFeita = true;
  } finally {
    migracaoAreaEmAndamento = false;
  }
}

async function renomearArea(id, nome) {

}
async function renomearDisciplina(id, nome) {

}

// Exclusão em cascata: o Firestore não apaga documentos filhos sozinho — cada
// nível precisa buscar e apagar tudo abaixo dele antes de se apagar. Os refs
// são coletados primeiro e só então commitados em lotes de até 400 (o limite
// do Firestore é 500 operações por batch), pra não estourar em conteúdos com
// muito histórico de sessões/registros acumulado.
async function coletarRefsExclusaoConteudo(contId) {
  const refs = [];
  const conceitosSnap = await db.collection('pontos').where('usuarioId', '==', uid).where('conteudoId', '==', contId).get();
  const conceitoIds = conceitosSnap.docs.map(d => d.id);
  conceitosSnap.docs.forEach(d => refs.push(d.ref));

  const sessoesSnap = await db.collection('sessoes').where('usuarioId', '==', uid).where('conteudoId', '==', contId).get();
  sessoesSnap.docs.forEach(d => refs.push(d.ref));

  // Firestore limita cláusulas `in` a 30 valores — quebra os ids em grupos.
  for (let i = 0; i < conceitoIds.length; i += 30) {
    const grupo = conceitoIds.slice(i, i + 30);
    const registrosSnap = await db.collection('registros').where('usuarioId', '==', uid).where('pontoId', 'in', grupo).get();
    registrosSnap.docs.forEach(d => refs.push(d.ref));
  }
  refs.push(db.collection('conteudos').doc(contId));
  return refs;
}
async function excluirRefsEmLotes(refs) {
  for (let i = 0; i < refs.length; i += 400) {
    const batch = db.batch();
    refs.slice(i, i + 400).forEach(ref => batch.delete(ref));
    await batch.commit();
  }
}
async function excluirDisciplina(discId) {
  let refs = [db.collection('disciplinas').doc(discId)];
  for (const c of conteudosDe(discId)) {
    refs = refs.concat(await coletarRefsExclusaoConteudo(c.id));
  }
  await excluirRefsEmLotes(refs);
}
async function excluirArea(areaId) {
  let refs = [db.collection('areas').doc(areaId)];
  for (const d of disciplinasDe(areaId)) {
    refs.push(db.collection('disciplinas').doc(d.id));
    for (const c of conteudosDe(d.id)) {
      refs = refs.concat(await coletarRefsExclusaoConteudo(c.id));
    }
  }
  await excluirRefsEmLotes(refs);
}

// Fecha o Ciclo 3 (checklist): aplica o resultado de cada conceito-chave avaliado,
// grava os registros para calibração futura do Leitner e decide a próxima tela.
async function concluirChecklist(conceitosAtivos) {
  const hoje = hojeStr();
  const batch = db.batch();
  let pendentes = 0;

  for (const c of conceitosAtivos) {
    const marca = ui.marcas[c.id];
    const ref = db.collection('pontos').doc(c.id);
    if (marca === 'acertei') {
      const novaCaixa = Math.min(5, c.caixa + 1);
      const dominado = novaCaixa === 5;
      batch.update(ref, {
        caixa: novaCaixa, dominado,
        proximaRevisao: dominado ? null : addDias(hoje, INTERVALOS_DIAS[novaCaixa])
      });
      await registrarAvaliacao(c.id, 'correto', c.caixa, novaCaixa);
    } else {
      pendentes += 1;
    }
  }
  const cont = contAtual();
  if (cont) batch.update(db.collection('conteudos').doc(cont.id), { avaliado: true });
  await batch.commit();

  if (pendentes) {
    // ui.marcas precisa continuar viva — a tela de Reestudo filtra por ela.
    ui.screen = 'reestudo';
    flash(MSG.algoFaltou);
  } else {
    ui.marcas = {};
    // Vindo de Revisões de hoje (ciclo 5) volta para lá, não para Conteúdo.
    ui.screen = ui.modo === 'ciclo5' ? 'revisoes' : 'conteudo';
    flash(MSG.tudoCerto);
  }
}

async function marcarRevisadoReestudo(conceitoId, caixaAntes) {
  await db.collection('pontos').doc(conceitoId).update({
    caixa: 1, dominado: false, proximaRevisao: addDias(hojeStr(), INTERVALOS_DIAS[1])
  });
  await registrarAvaliacao(conceitoId, 'incorreto', caixaAntes, 1);
  ui.revisados[conceitoId] = true;
  render();
}

// Navbar fixa — só nas telas de navegação/organização (Dashboard, Área,
// Disciplina, Conteúdo, Perfil). As telas de sessão de estudo não a chamam,
// pra manter a tela cheia sem distração.
function navbarHtml(ativo) {
  const dueQtd = dueTodos().reduce((n, d) => n + d.quantidade, 0);
  const item = (tela, icone, label, onclick) => `
    <button class="navbar-item${ativo === tela ? ' ativo' : ''}" onclick="${onclick}">
      <i class="ph-duotone ${icone}"></i>
      <span>${label}</span>
      ${tela === 'revisoes' && dueQtd ? `<span class="navbar-badge">${dueQtd}</span>` : ''}
    </button>`;
  return `<nav class="navbar">
    ${item('dashboard', 'ph-house', 'Início', "app.irDashboard()")}
    ${item('revisoes', 'ph-clock-countdown', 'Revisões de hoje', "app.irRevisoes()")}
    ${item('perfil', 'ph-user-circle', 'Perfil', "app.abrirPerfil()")}
  </nav>`;
}

// Breadcrumb tocável — usado nas telas Área, Disciplina e Conteúdo.
// `niveis` é uma lista de { label, onclick } do mais alto ao mais baixo;
// o último nível não é clicável (é a tela atual).
function breadcrumbHtml(niveis) {
  return `<div class="breadcrumb">${niveis.map((n, i) => {
    const ultimo = i === niveis.length - 1;
    const sep = i > 0 ? '<span class="bc-sep">›</span>' : '';
    return sep + (ultimo
      ? `<span class="bc-atual">${esc(n.label)}</span>`
      : `<span class="bc-item" onclick="${n.onclick}">${esc(n.label)}</span>`);
  }).join('')}</div>`;
}

function conceitosAtivos() {
  const cont = contAtual();
  if (!cont) return [];
  return ui.modo === 'ciclo5' ? dueDoConteudo(cont.id) : conceitosDe(cont.id);
}

function saudacao() {
  const h = new Date().getHours();
  return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
}

function iniciais(nome) {
  return (nome || '?').trim().charAt(0).toUpperCase();
}

function viewDashboard() {
  const nome = state.usuario ? state.usuario.nome : '';
  const areas = state.areas.slice().sort((a, b) => a.criadoEm - b.criadoEm);

    const r = resumoArea(a);
    const menuAberto = ui.menuAberto && ui.menuAberto.tipo === 'area' && ui.menuAberto.id === a.id;
    return `<div class="card" onclick="app.abrirArea('${a.id}')">
      <div style="display:flex;gap:12px;align-items:center;">

          <div class="card-head" style="align-items:center;">
            <span class="card-title" style="font-size:17px;">${esc(a.nome)}</span>
            <div class="card-head-actions" onclick="event.stopPropagation()">
              <button class="btn-kebab" onclick="app.alternarMenu('area','${a.id}')" aria-label="Mais opções de ${esc(a.nome)}"><i class="ph-duotone ph-dots-three-vertical" style="font-size:20px;"></i></button>
              ${menuAberto ? menuAcoesHtml('area', a.id) : ''}

          ${r.mostrarBarra ? `<div class="bar-bg"><div class="bar-fill" style="width:${r.largura}"></div></div>` : ''}

  const form_area = ui.criandoArea

        <input id="input-area" class="input" placeholder="Nome da área (ex.: Concurso TRF)" style="min-height:44px;font-size:16px;"
          oninput="document.getElementById('btn-area-add').disabled = !this.value.trim()">

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-lista pb-navbar">

    <h2 style="margin:0 0 14px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);">Suas áreas de estudo</h2>

  </div></div>${navbarHtml('dashboard')}`;
}

// Aba "Revisões de hoje" — separada do Início: só o que precisa ser feito
// hoje ("Hoje", em destaque) + um preview leve dos próximos dias, sem abrir
// a Revisão espaçada antes da data (ver requisitos-interface-design.md 4.10).
function viewRevisoes() {
  const due = dueTodos();
  const prox = proximosDias(7);

  const secaoHoje = due.length
    ? `<div class="card-due" style="margin-bottom:28px;">
        <div class="card-due-head">Hoje</div>
        ${due.map(d => `
          <div class="card-due-item" onclick="app.abrirDue('${d.discId}','${d.contId}')">
            <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;">
              <span style="font-size:15px;font-weight:600;">${esc(d.conteudo)}</span>
              <span style="font-size:13px;color:var(--color-neutral-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.disciplina)}</span>
            </div>
            <span class="tag" style="background:var(--color-accent-100);color:var(--color-accent-700);flex:none;">${d.quantidade}</span>
          </div>`).join('')}
      </div>`
    : `<h2 style="margin:0 0 20px;font-family:var(--font-heading);font-size:20px;font-weight:600;letter-spacing:-0.01em;">Nada pendente hoje</h2>`;

  const secaoProx = prox.length
    ? `<h2 style="margin:0 0 4px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);">Próximos dias</h2>
        ${prox.map(g => `
          <div class="proximos-grupo-titulo">${esc(g.label)}</div>
          ${g.itens.map(it => `
            <div class="proximos-item">
              <span class="conteudo-nome">${esc(it.conteudo)}</span>
              <span class="disc-nome">${esc(it.disciplina)}</span>
              <span class="qtd">${it.quantidade}</span>
            </div>`).join('')}`).join('')}`
    : '';

  const vazioTotal = !due.length && !prox.length;

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-lista pb-navbar">
    <h1 style="margin:0 0 22px;font-size:28px;line-height:1.15;">Revisões de hoje</h1>
    ${vazioTotal
      ? `<p style="margin:0;font-size:16px;line-height:1.5;max-width:34ch;color:var(--color-neutral-800);">Suas revisões aparecem aqui assim que você começar a estudar um conteúdo.</p>`
      : secaoHoje + secaoProx}
  </div></div>${navbarHtml('revisoes')}`;
}

function viewPerfil() {
  const nome = state.usuario ? state.usuario.nome : '';
  const conectado = auth.currentUser && auth.currentUser.providerData.some(p => p.providerId === 'google.com');
  const email = conectado ? auth.currentUser.providerData.find(p => p.providerId === 'google.com').email : '';
  const st = estatisticasPerfil();

  const stats_html = st.semHistorico
    ? `<p style="margin:16px 0 0;font-size:14px;line-height:1.5;color:var(--color-neutral-700);max-width:38ch;">Faça sua primeira revisão para começar a acompanhar seu progresso aqui.</p>`
    : `<div class="stats-row" style="margin-top:16px;">
        <div class="stat-card">
          <span class="stat-num">${st.sequencia}</span>
          <span class="stat-label">${st.sequencia === 1 ? 'dia seguido' : 'dias seguidos'}</span>
        </div>
        <div class="stat-card">
          <span class="stat-num">${st.dominados}</span>
          <span class="stat-label">conceitos-chave dominados</span>
        </div>
      </div>`;

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-lista pb-navbar">
    <h1 style="margin:0 0 22px;font-size:28px;line-height:1.15;">Perfil</h1>
    <div class="card" style="cursor:default;">
      <div style="display:flex;gap:12px;align-items:center;">
        <div class="avatar-area">${esc(iniciais(nome))}</div>
        <div style="flex:1;">
          <div style="font-size:16px;font-weight:600;">${esc(nome)}</div>
          <div style="font-size:13px;color:var(--color-neutral-700);margin-top:2px;">
            ${conectado ? 'Conectado com ' + esc(email) : 'Conta anônima — seus dados ficam só neste aparelho'}
          </div>
        </div>
      </div>
    </div>
    ${!conectado ? `<div id="google-btn-perfil" style="margin-top:16px;"></div>` : ''}
    ${stats_html}
  </div></div>${navbarHtml('perfil')}`;
}

function viewConteudo() {
  const cont = contAtual();
  if (!cont) { ui.screen = 'dashboard'; return viewDashboard(); }
  const disc = discPorId(cont.disciplinaId);
  const area = disc ? areaPorId(disc.areaId) : null;
  const conceitos = conceitosDe(cont.id);
  const totalCont = conceitos.length;
  const dominadosCont = conceitos.filter(c => c.dominado).length;
  const bloqueado = !cont.revisado || totalCont === 0;
  const mostrarBarra = cont.avaliado && totalCont > 0;
  const largura = totalCont ? Math.round((dominadosCont / totalCont) * 100) + '%' : '0%';

  const conceitos_html = conceitos.map(c => `
    <div class="card-conceito" style="cursor:default;">
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <span style="flex:1;font-size:15px;line-height:1.5;">${esc(c.texto)}</span>
        <button class="btn-icon" onclick="app.removerConceito('${c.id}')" aria-label="Remover conceito-chave"><i class="ph-duotone ph-trash" style="font-size:17px;color:var(--color-neutral-700);"></i></button>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="degraus">${degraus(c.caixa)}</div>
          <span style="font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;">${esc(legendaCurta(c.caixa))}</span>
        </div>
        <span style="font-size:12px;line-height:1.5;color:var(--color-neutral-700);">${esc(legenda(c.caixa))}</span>
      </div>
    </div>`).join('');

  const form_conceito = ui.criandoConceito
    ? `<div style="display:flex;flex-direction:column;gap:10px;">
        <textarea id="textarea-conceito" class="input" placeholder="Escreva o conceito-chave" style="min-height:72px;font-size:15px;padding:12px;"
          oninput="document.getElementById('btn-conceito-add').disabled = !this.value.trim()"></textarea>
        <div class="btn-row" style="max-width:260px;">
          <button id="btn-conceito-add" class="btn btn-primary" disabled style="min-height:44px;" onclick="app.confirmarCriarConceito()">Adicionar</button>
          <button class="btn btn-ghost" style="min-height:44px;" onclick="app.cancelarCriarConceito()">Cancelar</button>
        </div>
      </div>`
    : `<button class="btn btn-secondary" style="min-height:44px;" onclick="app.verCriarConceito()">+ adicionar conceito-chave</button>`;

  const dicaBloqueio = !cont.revisado
    ? 'Primeiro conclua "Revisar conteúdo" — depois você escreve o que lembra.'
    : 'Cadastre pelo menos um conceito-chave para revisar.';

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-largo pb-navbar">
    ${breadcrumbHtml([
      { label: 'Início', onclick: 'app.irDashboard()' },
      { label: area ? area.nome : 'Área', onclick: `app.abrirArea('${area ? area.id : ''}')` },
      { label: disc ? disc.nome : 'Disciplina', onclick: `app.abrirDisciplina('${disc ? disc.id : ''}')` },
      { label: cont.titulo }
    ])}
    <h1 style="margin:0 0 10px;font-size:28px;line-height:1.15;">${esc(cont.titulo)}</h1>
    <div style="margin-bottom:24px;max-width:460px;">
      ${mostrarBarra ? `<div class="bar-bg" style="margin-bottom:8px;"><div class="bar-fill" style="width:${largura}"></div></div>` : ''}
      <span style="font-size:13px;color:var(--color-neutral-700);">${esc(progressoDe(cont))}</span>
    </div>
    <div class="grid2">
      <div style="display:flex;flex-direction:column;">
        <h2 style="margin:0 0 8px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);">Material original</h2>
        <textarea id="textarea-material" class="input" placeholder="Cole aqui o material — opcional." style="min-height:140px;font-size:15px;line-height:1.5;padding:12px;margin-bottom:26px;"
          onchange="app.salvarMaterial('${cont.id}', this.value)">${esc(cont.material || '')}</textarea>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
          <h2 style="margin:0 0 6px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);">Conceitos-chave</h2>
          <p style="margin:0;font-size:14px;color:var(--color-neutral-800);">Adicione fatos e conceitos-chave que você precisa aprender.</p>
        </div>
        ${conceitos_html}
        <div>${form_conceito}</div>
        <div class="faixa" style="border-radius:6px;margin-top:8px;">A próxima etapa é de memória: você escreve o que lembra, sem o material à vista.</div>
        <div class="btn-row">
          <button class="btn btn-primary" style="min-height:52px;font-size:15px;" onclick="app.irLer()">Revisar conteúdo</button>
          <button class="btn btn-secondary" ${bloqueado ? 'disabled' : ''} style="min-height:52px;font-size:15px;" onclick="app.irLivre()">Revisar conceitos-chave</button>
        </div>
        ${bloqueado ? `<p style="margin:0;font-size:13px;line-height:1.4;color:var(--color-neutral-700);">${esc(dicaBloqueio)}</p>` : ''}
      </div>
    </div>
  </div></div>${navbarHtml()}`;
}

function sessaoHeaderHtml(titulo, subtitulo, extra) {
  return `<div class="sessao-header">
    <button class="sessao-close" onclick="app.voltar()" aria-label="Fechar">✕</button>
    <div class="sessao-titulos">
      <span class="sessao-titulo">${esc(titulo)}</span>
      ${subtitulo ? `<span class="sessao-subtitulo">${esc(subtitulo)}</span>` : ''}
    </div>
    ${extra || ''}
  </div>`;
}

function viewLer() {
  const cont = contAtual();
  if (!cont) { ui.screen = 'dashboard'; return viewDashboard(); }
  const material = cont.material || '';
  const paragrafos = material ? material.split(/\n{2,}|\n/).filter(t => t.trim()) : [];
  const semMaterial = !material
    ? `<p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:var(--color-neutral-700);">Nenhum material cadastrado neste conteúdo — revise pelo seu próprio material e marque a leitura.</p>` : '';
  const paragrafos_html = paragrafos.map(p => `<p style="margin:0 0 16px;font-size:16px;line-height:1.6;max-width:70ch;">${esc(p.trim())}</p>`).join('');

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-leitura">
    ${sessaoHeaderHtml('Revisar conteúdo', cont.titulo)}
    ${semMaterial}
    ${paragrafos_html}
    <button class="btn btn-primary" style="min-height:52px;font-size:16px;margin-top:24px;" onclick="app.concluirLeitura('${cont.id}')">Concluí a leitura</button>
  </div></div>`;
}

function viewLivre() {
  const cont = contAtual();
  if (!cont) { ui.screen = 'dashboard'; return viewDashboard(); }
  const origem = ui.modo === 'ciclo5' ? 'Revisões de hoje · ' + cont.titulo : cont.titulo;
  return `<div class="elo-tela" style="min-height:100%;display:flex;flex-direction:column;">${faixaHtml()}
    <div class="wrap wrap-leitura" style="flex:1;">
      ${sessaoHeaderHtml('Revisão livre', origem)}
      <p style="margin:0 0 16px;font-size:15px;color:var(--color-neutral-800);">Escreva tudo que você lembra, sem consultar o conteúdo.</p>
      <textarea id="textarea-recordacao" class="input" placeholder="Comece por onde lembrar." style="flex:1;min-height:240px;font-size:16px;line-height:1.5;padding:14px;resize:none;margin-bottom:16px;"
        oninput="document.getElementById('btn-enviar-recordacao').disabled = !this.value.trim()"></textarea>
      <button id="btn-enviar-recordacao" class="btn btn-primary" disabled style="min-height:52px;font-size:16px;" onclick="app.enviarRecordacao()">Enviar recordação</button>
    </div>
  </div>`;
}

function viewChecklist() {
  const cont = contAtual();
  if (!cont) { ui.screen = 'dashboard'; return viewDashboard(); }
  const itens = conceitosAtivos();
  const todosMarcados = itens.every(c => ui.marcas[c.id]);

  const itens_html = itens.map(c => {
    const m = ui.marcas[c.id] || '';
    const cls = (v, classe) => m === v ? ' ' + classe : '';
    const trecho = trechoPara(cont, c);
    const aberto = !!ui.abertosTrechos[c.id];
    return `<div class="card-conceito">
      <span style="font-size:15px;line-height:1.5;">${esc(c.texto)}</span>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="degraus">${degraus(c.caixa)}</div>
          <span style="font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;">${esc(legendaCurta(c.caixa))}</span>
        </div>
        <span style="font-size:12px;line-height:1.5;color:var(--color-neutral-700);">${esc(legenda(c.caixa))}</span>
      </div>
      <div class="btn-row">
        <button class="estado-btn${cls('acertei', 'sel-sucesso')}" onclick="app.marcar('${c.id}','acertei')">Cobri isso</button>
        <button class="estado-btn${cls('errei', 'sel-atencao')}" onclick="app.marcar('${c.id}','errei')">Errei</button>
        <button class="estado-btn${cls('nao', 'sel-atencao')}" onclick="app.marcar('${c.id}','nao')">Não lembrei</button>
      </div>
      ${trecho ? `<button class="btn btn-ghost" style="align-self:flex-start;padding-inline:0;font-size:13px;" onclick="app.alternarTrecho('${c.id}')">${aberto ? 'Ocultar trecho do material' : 'Ver trecho do material'}</button>` : ''}
      ${aberto ? `<p style="margin:0;padding:12px 14px;background:var(--color-surface-sunken);border-radius:6px;font-size:14px;line-height:1.5;">${esc(trecho)}</p>` : ''}
    </div>`;
  }).join('');

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-largo">
    ${sessaoHeaderHtml('Checklist', cont.titulo)}
    <p style="margin:0 0 18px;font-size:15px;color:var(--color-neutral-800);">Compare sua recordação com cada conceito-chave.</p>
    <div class="grid2">
      <div style="display:flex;flex-direction:column;margin-bottom:20px;">
        <h2 style="margin:0 0 10px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-700);">Sua recordação</h2>
        <p style="margin:0;padding:14px 16px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:10px;font-size:15px;line-height:1.55;white-space:pre-wrap;">${esc(ui.ultimaRecordacao || '')}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;">
        ${itens_html}
        <button class="btn btn-primary" ${todosMarcados ? '' : 'disabled'} style="min-height:52px;font-size:16px;margin-top:10px;" onclick="app.concluirChecklistClick()">Concluir autoavaliação</button>
        ${!todosMarcados ? `<p style="margin:0;font-size:13px;color:var(--color-neutral-700);">Classifique todos os conceitos-chave para concluir.</p>` : ''}
      </div>
    </div>
  </div></div>`;
}

function viewReestudo() {
  const cont = contAtual();
  if (!cont) { ui.screen = 'dashboard'; return viewDashboard(); }
  const pendentes = conceitosAtivos().filter(c => ui.marcas[c.id] === 'errei' || ui.marcas[c.id] === 'nao');
  const resumo = pendentes.length === 1
    ? 'Um conceito-chave ficou para trás. Reveja e marque como revisado.'
    : pendentes.length + ' conceitos-chave ficaram para trás. Reveja cada um e marque como revisado.';
  const todosFeitos = pendentes.every(c => ui.revisados[c.id]);

  const pendentes_html = pendentes.map(c => {
    const trecho = trechoPara(cont, c);
    const feito = !!ui.revisados[c.id];
    return `<div class="card-conceito">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;">
        <span style="font-size:15px;line-height:1.5;flex:1;">${esc(c.texto)}</span>
        <span class="tag tag-accent-2">${ui.marcas[c.id] === 'errei' ? 'Errei' : 'Não lembrei'}</span>
      </div>
      ${trecho ? `<p style="margin:0;padding:12px 14px;background:var(--color-surface-sunken);border-radius:6px;font-size:14px;line-height:1.5;">${esc(trecho)}</p>` : ''}
      <button class="btn btn-secondary" ${feito ? 'disabled' : ''} style="align-self:flex-start;min-height:44px;" onclick="app.marcarRevisado('${c.id}', ${c.caixa})">${feito ? 'Revisado' : 'Marquei como revisado'}</button>
    </div>`;
  }).join('');

  return `<div class="elo-tela">${faixaHtml()}<div class="wrap wrap-leitura">
    ${sessaoHeaderHtml('Reestudo', cont.titulo)}
    <p style="margin:0 0 16px;font-size:15px;color:var(--color-neutral-800);">${esc(resumo)}</p>
    <div style="display:flex;flex-direction:column;gap:12px;">${pendentes_html}</div>
    <button class="btn btn-primary" ${todosFeitos ? '' : 'disabled'} style="min-height:52px;font-size:16px;margin-top:22px;" onclick="app.concluirReestudo()">Concluir reestudo</button>
  </div></div>`;
}

/* ============================================================
   Handlers — chamados pelos onclick/onchange do HTML acima
   ============================================================ */
const app = {
  async comecar() {
    const nome = (document.getElementById('input-nome').value || '').trim();
    if (!nome) return;
    try {
      await salvarNome(nome);
      ui.erroOnboarding = false;
      ui.screen = 'dashboard';
      render();
    } catch (e) {
      console.error(e);
      ui.erroOnboarding = true;
      render();
    }
  },

  abrirArea(id) {
    ui.areaId = id; ui.screen = 'area'; ui.faixa = ''; ui.menuAberto = null;
    render();
  },

  abrirDisciplina(id) {
    const d = discPorId(id);
    ui.discId = id; ui.areaId = d ? d.areaId : ui.areaId;
    ui.screen = 'disciplina'; ui.faixa = ''; ui.menuAberto = null;
    render();
  },

  abrirConteudo(id) {
    const c = contPorId(id);
    ui.contId = id; ui.discId = c ? c.disciplinaId : ui.discId;
    const d = discPorId(ui.discId);
    ui.areaId = d ? d.areaId : ui.areaId;
    ui.modo = 'ciclo2'; ui.marcas = {}; ui.revisados = {};
    ui.screen = 'conteudo'; ui.faixa = '';
    render();
  },

  abrirDue(discId, contId) {
    ui.discId = discId; ui.contId = contId;
    ui.modo = 'ciclo5'; ui.marcas = {}; ui.revisados = {};
    ui.screen = 'livre'; ui.faixa = '';
    render();
  },

  abrirPerfil() { ui.screen = 'perfil'; ui.faixa = ''; render(); },
  irDashboard() { ui.screen = 'dashboard'; ui.faixa = ''; ui.menuAberto = null; render(); },

  voltar() {
    // O botão de fechar (✕) das telas de sessão sai da sessão inteira, não
    // volta um passo dentro dela — por isso Checklist/Livre/Reestudo apontam
    // direto para Conteúdo, exceto quando vieram de Revisões de hoje (ciclo 5),
    // caso em que voltam para lá em vez de Conteúdo.
    const viaCiclo5 = ui.modo === 'ciclo5' && (ui.screen === 'livre' || ui.screen === 'checklist' || ui.screen === 'reestudo');
    const mapa = { area: 'dashboard', disciplina: 'area', conteudo: 'disciplina', ler: 'conteudo', livre: 'conteudo', checklist: 'conteudo', reestudo: 'conteudo' };
    ui.screen = viaCiclo5 ? 'revisoes' : (mapa[ui.screen] || 'dashboard');
    ui.faixa = ''; ui.menuAberto = null;
    render();
  },

  verCriarArea() { ui.criandoArea = true; render(); },
  cancelarCriarArea() { ui.criandoArea = false; render(); },
  async confirmarCriarArea() {
    const nome = (document.getElementById('input-area').value || '').trim();
    if (!nome) return;
    try {
      await criarArea(nome);
      ui.criandoArea = false;
      flash(MSG.areaCriada);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); }
  },

  verCriarDisciplina() { ui.criandoDisciplina = true; render(); },
  cancelarCriarDisciplina() { ui.criandoDisciplina = false; render(); },
  async confirmarCriarDisciplina() {
    const nome = (document.getElementById('input-disciplina').value || '').trim();
    if (!nome || !ui.areaId) return;
    try {
      await criarDisciplina(ui.areaId, nome);
      ui.criandoDisciplina = false;
      flash(MSG.disciplinaCriada);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); }
  },

  verCriarConteudo() { ui.criandoConteudo = true; render(); },
  cancelarCriarConteudo() { ui.criandoConteudo = false; render(); },
  async confirmarCriarConteudo() {
    const titulo = (document.getElementById('input-conteudo').value || '').trim();
    if (!titulo || !ui.discId) return;
    try {
      await criarConteudo(ui.discId, titulo);
      ui.criandoConteudo = false;
      flash(MSG.conteudoCriado);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); }
  },

  verCriarConceito() { ui.criandoConceito = true; render(); },
  cancelarCriarConceito() { ui.criandoConceito = false; render(); },
  async confirmarCriarConceito() {
    const texto = (document.getElementById('textarea-conceito').value || '').trim();
    if (!texto || !ui.contId) return;
    try {
      await criarConceito(ui.contId, texto);
      ui.criandoConceito = false;
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); }
  },

  async removerConceito(id) {
    try { await removerConceito(id); }
    catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  async salvarMaterial(contId, valor) {
    try { await salvarMaterial(contId, valor); }
    catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  irLer() { ui.screen = 'ler'; ui.faixa = ''; render(); },
  irLivre() { ui.screen = 'livre'; ui.modo = 'ciclo2'; ui.marcas = {}; ui.revisados = {}; ui.faixa = ''; render(); },

  async concluirLeitura(contId) {
    try {
      await marcarLeituraConcluida(contId);
      ui.screen = 'conteudo';
      flash(MSG.leituraConcluida);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  async enviarRecordacao() {
    const texto = (document.getElementById('textarea-recordacao').value || '').trim();
    if (!texto || !ui.contId) return;
    try {
      await registrarSessao(ui.contId, ui.modo, texto);
      ui.ultimaRecordacao = texto;
      ui.marcas = {}; ui.abertosTrechos = {};
      ui.screen = 'checklist';
      flash(MSG.recordacaoEnviada);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  marcar(conceitoId, valor) { ui.marcas[conceitoId] = valor; render(); },
  alternarTrecho(conceitoId) { ui.abertosTrechos[conceitoId] = !ui.abertosTrechos[conceitoId]; render(); },

  async concluirChecklistClick() {
    const itens = conceitosAtivos();
    if (!itens.every(c => ui.marcas[c.id])) return;
    try {
      await concluirChecklist(itens);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  async marcarRevisado(conceitoId, caixaAntes) {
    try { await marcarRevisadoReestudo(conceitoId, caixaAntes); }
    catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  concluirReestudo() {
    // Vindo de Revisões de hoje (ciclo 5) volta para lá, não para Conteúdo.
    ui.screen = ui.modo === 'ciclo5' ? 'revisoes' : 'conteudo';
    ui.marcas = {};
    ui.revisados = {};
    flash(MSG.reestudoConcluido);
    render();
  },

  irRevisoes() { ui.screen = 'revisoes'; ui.faixa = ''; ui.menuAberto = null; render(); },

  alternarMenu(tipo, id) {
    ui.menuAberto = (ui.menuAberto && ui.menuAberto.tipo === tipo && ui.menuAberto.id === id) ? null : { tipo, id };
    render();
  },
  fecharMenu() { ui.menuAberto = null; render(); },

  verRenomear(tipo, id) {
    const item = tipo === 'area' ? areaPorId(id) : discPorId(id);
    if (!item) return;
    ui.menuAberto = null;
    ui.renomeando = { tipo, id, valor: item.nome };
    render();
  },
  cancelarRenomear() { ui.renomeando = null; render(); },
  async confirmarRenomear() {
    const nome = (document.getElementById('input-renomear').value || '').trim();
    if (!nome || !ui.renomeando) return;
    const { tipo, id } = ui.renomeando;
    try {
      if (tipo === 'area') await renomearArea(id, nome);
      else await renomearDisciplina(id, nome);
      ui.renomeando = null;
      flash(MSG.nomeAtualizado);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  },

  verExcluir(tipo, id) {
    const item = tipo === 'area' ? areaPorId(id) : discPorId(id);
    if (!item) return;
    ui.menuAberto = null;
    ui.confirmandoExclusao = { tipo, id, nome: item.nome };
    render();
  },
  cancelarExcluir() { ui.confirmandoExclusao = null; render(); },
  async confirmarExcluir() {
    if (!ui.confirmandoExclusao) return;
    const { tipo, id } = ui.confirmandoExclusao;
    try {
      if (tipo === 'area') {
        await excluirArea(id);
        if (ui.areaId === id) { ui.areaId = null; ui.screen = 'dashboard'; }
      } else {
        const disc = discPorId(id);
        await excluirDisciplina(id);
        if (ui.discId === id) { ui.discId = null; ui.screen = disc ? 'area' : 'dashboard'; if (disc) ui.areaId = disc.areaId; }
      }
      ui.confirmandoExclusao = null;
      flash(MSG.itemExcluido);
      render();
    } catch (e) { console.error(e); flash(MSG.erroSalvar, true); render(); }
  }
};

/* ---------- Boot ---------- */
garantirAuth();
</script>
</body>
</html>
